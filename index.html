<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CRITICAL FOR MOBILE: Ensures proper scaling and zooming on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>People Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <style>
        /* Mobile-friendly touches */
        body {
            background-color: #f8f9fa;
            padding-bottom: 3rem;
        }
        .app-card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border-radius: 0.75rem;
        }
        /* Ensure touch targets are comfortable on mobile */
        .btn, .form-control {
            min-height: 48px;
        }
    </style>
</head>

<body>

    <!-- Mobile App Header Navbar -->
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 w-100 text-center">People Database</span>
        </div>
    </nav>

    <div class="container py-2" style="max-width: 600px;">

        <!-- Add Person Card -->
        <div class="card app-card p-4 mb-4">
            <h2 class="h4 mb-3 text-primary">Add Person</h2>
            <form id="personForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter full name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Date of Birth</label>
                    <input type="date" id="dob" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Save Person</button>
            </form>
        </div>

        <!-- Search Person Card -->
        <div class="card app-card p-4 mb-4">
            <h2 class="h4 mb-2 text-success">Search Person</h2>
            <p class="text-muted small mb-3">Fill in either field (or both) to search.</p>
            <form id="searchForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Search by Name</label>
                    <input type="text" id="searchName" class="form-control" placeholder="Type a name...">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Search by Date of Birth</label>
                    <input type="date" id="searchDob" class="form-control">
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">Search Database</button>
            </form>
        </div>

        <!-- Results Display -->
        <div class="card app-card p-4">
            <h3 class="h5 mb-3">Results</h3>
            <ul id="searchResults" class="list-group list-group-flush">
                <li class="list-group-item text-muted text-center py-3">No searches performed yet.</li>
            </ul>
        </div>

    </div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* PASTE YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "AIzaSyBQZSVOS-BqWiuUOKPTnq29G453Yw2F-ms",
    authDomain: "client-manager-15f01.firebaseapp.com",
    projectId: "client-manager-15f01",
    storageBucket: "client-manager-15f01.firebasestorage.app",
    messagingSenderId: "1093887449790",
    appId: "1:1093887449790:web:9cd6bf7b0ed66b29fb5cef",
    measurementId: "G-V46KYCM5BE"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// --- SAVE LOGIC ---
document.getElementById("personForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value;
    const dob = document.getElementById("dob").value;

    try {
        await addDoc(collection(db, "people"), {
            name,
            dob,
            createdAt: new Date()
        });
        alert("Saved successfully!");
        document.getElementById("personForm").reset();
    } catch (error) {
        console.error(error);
        alert("Error saving data");
    }
});

// --- SEARCH LOGIC ---
document.getElementById("searchForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const searchName = document.getElementById("searchName").value.trim().toLowerCase();
    const searchDob = document.getElementById("searchDob").value;
    const resultsContainer = document.getElementById("searchResults");
    
    resultsContainer.innerHTML = "";

    if (!searchName && !searchDob) {
        alert("Please enter a name or DOB to search.");
        return;
    }

    try {
        const peopleRef = collection(db, "people");
        let querySnapshot;

        if (searchDob) {
            const q = query(peopleRef, where("dob", "==", searchDob));
            querySnapshot = await getDocs(q);
        } else {
            querySnapshot = await getDocs(peopleRef);
        }

        let matchesFound = 0;

        querySnapshot.forEach((doc) => {
            const data = doc.data();
            const personName = (data.name || "").toLowerCase();
            const matchesName = searchName ? personName.includes(searchName) : true;

            if (matchesName) {
                matchesFound++;
                const li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center py-3 px-0";
                li.innerHTML = `
                  <div>
                      <h6 class="mb-0 fw-bold">${data.name}</h6>
                  </div>
                  <span class="badge bg-secondary rounded-pill p-2">${data.dob}</span>
                `;
                resultsContainer.appendChild(li);
            }
        });

        if (matchesFound === 0) {
            resultsContainer.innerHTML = `<li class="list-group-item text-danger text-center py-3">No matching records found.</li>`;
        }

    } catch (error) {
        console.error("Error searching database: ", error);
        alert("Error fetching data. Check your console.");
    }
});

</script>

</body>
</html>
