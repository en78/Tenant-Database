<!DOCTYPE html>
<html>
<head>
    <title>People Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h2>Add Person</h2>
    <form id="personForm" class="mb-5">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" id="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Date of Birth</label>
            <input type="date" id="dob" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>

    <hr>

    <!-- NEW: SEARCH SECTION -->
    <h2>Search Person</h2>
    <p class="text-muted">Fill in either field (or both) to search.</p>
    <form id="searchForm" class="mb-4">
        <div class="mb-3">
            <label>Search by Name</label>
            <input type="text" id="searchName" class="form-control">
        </div>
        <div class="mb-3">
            <label>Search by Date of Birth</label>
            <input type="date" id="searchDob" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">Search</button>
    </form>

    <!-- NEW: RESULTS DISPLAY -->
    <h3>Results:</h3>
    <ul id="searchResults" class="list-group">
        <!-- Results will be injected here dynamically -->
    </ul>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
// UPDATED: Added query, where, and getDocs to the imports
import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* PASTE YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
    apiKey: "AIzaSyBQZSVOS-BqWiuUOKPTnq29G453Yw2F-ms",
    authDomain: "client-manager-15f01.firebaseapp.com",
    projectId: "client-manager-15f01",
    storageBucket: "client-manager-15f01.firebasestorage.app",
    messagingSenderId: "1093887449790",
    appId: "1:1093887449790:web:9cd6bf7b0ed66b29fb5cef",
    measurementId: "G-V46KYCM5BE"
  };

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// --- SAVE LOGIC ---
document.getElementById("personForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value;
    const dob = document.getElementById("dob").value;

    try {
        await addDoc(collection(db, "people"), {
            name,
            dob,
            createdAt: new Date()
        });
        alert("Saved successfully!");
        document.getElementById("personForm").reset(); // Clear form after save
    } catch (error) {
        console.error(error);
        alert("Error saving data");
    }
});


// --- UPDATED SEARCH LOGIC ---
document.getElementById("searchForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const searchName = document.getElementById("searchName").value.trim().toLowerCase();
    const searchDob = document.getElementById("searchDob").value;
    const resultsContainer = document.getElementById("searchResults");
    
    // Clear old results
    resultsContainer.innerHTML = "";

    if (!searchName && !searchDob) {
        alert("Please enter a name or DOB to search.");
        return;
    }

    try {
        const peopleRef = collection(db, "people");
        let querySnapshot;

        // 1. If DOB is provided, filter by DOB in Firestore to minimize data pulled.
        // Otherwise, fetch all documents to perform partial name filtering on client side.
        if (searchDob) {
            const q = query(peopleRef, where("dob", "==", searchDob));
            querySnapshot = await getDocs(q);
        } else {
            querySnapshot = await getDocs(peopleRef);
        }

        let matchesFound = 0;

        // 2. Filter records in JS for partial name matches
        querySnapshot.forEach((doc) => {
            const data = doc.data();
            const personName = (data.name || "").toLowerCase();

            // Check if input substring exists in person's name
            const matchesName = searchName ? personName.includes(searchName) : true;

            if (matchesName) {
                matchesFound++;
                const li = document.createElement("li");
                li.className = "list-group-item d-flex align-items-center gap-3";
                li.innerHTML = `
                  <span><strong>Name:</strong> ${data.name}</span>
                  <span class="badge bg-secondary p-2">DOB: ${data.dob}</span>
                `;
                resultsContainer.appendChild(li);
            }
        });

        // 3. Display warning ONLY if zero actual matches were appended
        if (matchesFound === 0) {
            resultsContainer.innerHTML = `<li class="list-group-item text-danger">No matching records found.</li>`;
        }

    } catch (error) {
        console.error("Error searching database: ", error);
        alert("Error fetching data. Check your console.");
    }
});

</script>

</body>
</html>
